name: Temporary Cloudflare Deploy

on:
  push:
    branches:
      - deploy/cloudflare-temporary

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build AuraFit
        run: npm run build:portable
      - name: Deploy to temporary Cloudflare account
        env:
          NO_COLOR: "1"
        run: npx wrangler deploy --temporary
