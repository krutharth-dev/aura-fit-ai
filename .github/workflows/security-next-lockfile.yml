name: Temporary Next.js lockfile refresh

on:
  push:
    branches:
      - security/next-16-3-8
    paths:
      - .github/workflows/security-next-lockfile.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.repository == 'krutharth-dev/aura-fit-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate package and lockfile from npm registry
        run: npm install next@16.3.8 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify deterministic install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only dependency manifests to the dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git diff --cached --quiet && { echo "No dependency changes generated"; exit 1; }
          git commit -m "fix: upgrade Next.js to 16.3.8 and refresh lockfile"
          git push origin HEAD:security/next-16-3-8
      - name: Audit production dependencies
        run: npm audit --omit=dev
