name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this project. Please remove secrets and personal data before submitting.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am not reporting a security vulnerability.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include relevant OS, hardware, runtime, dependency, browser, or compiler details.
  - type: textarea
    attributes:
      label: Logs or screenshots
      description: Paste relevant output after removing secrets and personal information.
      render: shell
