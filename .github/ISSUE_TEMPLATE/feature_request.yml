name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a similar request.
          required: true
  - type: textarea
    attributes:
      label: Problem or opportunity
      description: What need would this address, and who would benefit?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the desired behaviour and, if useful, a possible implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches.
  - type: textarea
    attributes:
      label: Additional context
      description: Add diagrams, examples, references, or screenshots if helpful.
